<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QiQi Studio Book</title>
<meta name="theme-color" content="#7a2b3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QiQi Book">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.so{margin-left:auto;align-self:center;background:transparent;color:#f6d9dc;border-color:rgba(246,217,220,.45);padding:5px 12px;font-size:13px}
.login{max-width:420px;margin:0 auto;width:100%}.login form{display:grid;gap:12px}

/* Layout: wine header band with brand + tabs, then one working column of panels; rows are scannable ledger lines. */
:root{
  --bg:#fbf1f2; --surface:#ffffff; --blush:#f6d9dc; --wine:#7a2b3b; --on-wine:#fff6f7;
  --ink:#3a1a21; --muted:#8a5f68; --line:#efd2d6; --ok:#2e7a54; --warn:#a85d12; --bad:#b3303a;
  --ok-bg:#e3f2ea; --warn-bg:#fbecd9; --bad-bg:#fbe1e3;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d0f12; --surface:#2a161a; --blush:#3a1f25; --wine:#e8a1ae; --on-wine:#2a1218;
  --ink:#f7e4e7; --muted:#c29aa2; --line:#45272e; --ok:#74c9a0; --warn:#e8a860; --bad:#f2878f;
  --ok-bg:#1d3329; --warn-bg:#3a2a17; --bad-bg:#3d1c21; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1d0f12; --surface:#2a161a; --blush:#3a1f25; --wine:#e8a1ae; --on-wine:#2a1218;
  --ink:#f7e4e7; --muted:#c29aa2; --line:#45272e; --ok:#74c9a0; --warn:#e8a860; --bad:#f2878f;
  --ok-bg:#1d3329; --warn-bg:#3a2a17; --bad-bg:#3d1c21; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#7a2b3b}
header{background:#7a2b3b;color:#fff6f7;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:14px 6px}
.brand h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:30px;margin:0;line-height:1}
.brand h1 span{font-style:normal;font-size:16px;vertical-align:super;margin-left:2px}
.brand small{letter-spacing:.22em;text-transform:uppercase;font-size:11px;opacity:.85}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:#f6d9dc;text-decoration:none;padding:10px 12px;font-weight:500;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#f6d9dc}
.tabs a:focus-visible{outline:2px solid #fff;outline-offset:-2px}
main{padding-block:20px 60px;display:grid;gap:20px}
h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-style:italic;font-weight:500;font-size:19px;margin:0 0 8px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--blush);border-radius:var(--r);padding:14px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--wine);line-height:1.15}
.stat span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.num{font-variant-numeric:tabular-nums}
button,.btn{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:500;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.primary{background:var(--wine);color:var(--on-wine);border-color:var(--wine)}
.ghost{background:transparent}
.danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;padding:7px 12px}
.seg button[aria-pressed="true"]{background:var(--blush);color:var(--wine);font-weight:600}
.list{display:grid}
.day{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 2px 6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:hover{background:color-mix(in srgb,var(--blush) 45%,transparent)}
.row .when{font-variant-numeric:tabular-nums;font-weight:600;color:var(--wine);min-width:62px;font-size:14px}
.row .mid{min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .end{text-align:right;display:grid;gap:4px;justify-items:end}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--blush);color:var(--wine);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.mini{padding:4px 10px;font-size:12px}
.empty{color:var(--muted);padding:18px 4px;font-size:14px}
.notice{background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:14px}
.att{display:grid;gap:8px}
.att div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.att div:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-bottom:0;color:var(--wine)}
.scroll{overflow-x:auto}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;padding:0;border-radius:50%}
.qty b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(40,10,18,.55)}
dialog form{display:grid;gap:14px;padding:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:460px){.fgrid{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:500;padding-top:18px}
label.chk input{width:18px;height:18px}
.sect{grid-column:1/-1;font-family:var(--display);font-style:italic;font-size:16px;color:var(--wine);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.suggest{grid-column:1/-1;background:var(--blush);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.suggest b{font-family:var(--display);font-size:20px;color:var(--wine)}
.factions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.card:hover{border-color:var(--wine)}
.card .nm{font-family:var(--display);font-size:19px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
/* loyalty card: QiQi brand object, same look in both themes */
.lc{position:relative;aspect-ratio:1.6/1;width:100%;max-width:440px;border-radius:18px;overflow:hidden;background:#7a2b3b;color:#7a2b3b;box-shadow:0 10px 26px rgba(30,5,12,.28);container-type:inline-size}
.lc::before{content:"";position:absolute;inset:-12% -6%;background:radial-gradient(ellipse 58% 62% at 50% 50%,#fbecee 0%,#f6d9dc 55%,rgba(246,217,220,0) 100%)}
.lc-in{position:relative;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding:6cqw 8cqw 5cqw;gap:1.6cqw}
.lc-top{display:flex;justify-content:space-between;align-items:baseline}
.lc-logo{font-family:var(--display);font-style:italic;font-weight:600;font-size:9cqw;line-height:1}
.lc-logo span{font-style:normal;font-size:4cqw;vertical-align:super}
.lc-tag{font-size:2.3cqw;letter-spacing:.28em;text-transform:uppercase;font-weight:600}
.lc-name{font-family:var(--display);font-size:4.4cqw;font-weight:500}
.lc-name small{font-family:var(--body);font-size:2.4cqw;letter-spacing:.14em;text-transform:uppercase;margin-left:1.5cqw;opacity:.75}
.lc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2.2cqw 4cqw;align-content:center;justify-items:center}
.lc-dot{width:10.5cqw;aspect-ratio:1;border-radius:50%;border:.45cqw dashed rgba(122,43,59,.55);display:grid;place-items:center;font-size:2cqw;font-weight:600;text-align:center;line-height:1.1;color:rgba(122,43,59,.75)}
.lc-dot.on{background:#7a2b3b;border:0;color:#f6d9dc;font-size:5.5cqw}
.lc-dot.gift:not(.on){border-style:solid;border-color:#7a2b3b;color:#7a2b3b}
.lc-foot{display:flex;justify-content:space-between;gap:2cqw;font-size:2.3cqw;letter-spacing:.06em}
.loy{display:grid;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.loy-btns{display:flex;gap:8px;flex-wrap:wrap}
.loy textarea{min-height:84px;font-size:13px}
a.btn{text-decoration:none;display:inline-block}
.chops{display:inline-flex;gap:4px;align-items:center}
.chops i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--wine)}
.chops i.on{background:var(--wine)}
.chops em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><h1>QiQi<span>✦</span></h1><small>Nail studio · book</small><button id="signout" class="so" type="button" hidden>Sign out</button></div>
    <nav class="tabs" id="tabs">
      <a href="#today">Today</a><a href="#bookings">Bookings</a><a href="#clients">Clients</a>
      <a href="#press-ons">Press-ons</a><a href="#supplies">Supplies</a><a href="#money">Money</a>
    </nav>
  </div>
</header>
<main class="wrap" id="main">
  <div class="panel"><h3>Opening your studio book…</h3><p class="empty">Your bookings, clients, press-on orders, supplies and money will appear here.</p></div>
</main>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc as fdoc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const CONFIGURED = !!firebaseConfig.apiKey && !String(firebaseConfig.apiKey).startsWith("PASTE");
let auth=null, fs=null;
if(CONFIGURED){ const app=initializeApp(firebaseConfig); auth=getAuth(app); fs=initializeFirestore(app,{localCache:persistentLocalCache(),ignoreUndefinedProperties:true}); }
const colRef=n=>collection(fs,"studio","data",n);
const cardRef=id=>fdoc(fs,"cards",id);
/* small wrapper so the page code reads the same as before */
const shim={collection(n){ const c=colRef(n); return {
  doc(id){ const r=id?fdoc(c,id):fdoc(c); return {id:r.id,set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}; },
  onSnapshot(next,err){ return onSnapshot(c,s=>next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:s.metadata}),err); } }; }};
/* ---------- QiQi price list ---------- */
const SETS = [
  {id:"classic",name:"Classic Gel",price:28},
  {id:"soft",name:"Soft Girl · Tier 1",price:38},
  {id:"sweet",name:"Sweet Spot · Tier 2",price:48},
  {id:"slay",name:"Full Slay · Tier 3",price:58},
  {id:"none",name:"No set (repair / removal only)",price:0}];
const EXT = [{id:"none",name:"None",price:0},{id:"gelx",name:"Gel-X (+$15)",price:15},{id:"dual",name:"Dual form (+$25)",price:25}];
const REMOVAL = [{id:"none",name:"None",price:0},{id:"qiqinew",name:"QiQi set + new set (free)",price:0},{id:"qiqi",name:"QiQi set only ($8)",price:8},{id:"other",name:"Other salon's work ($10)",price:10}];
const PRESS = [{id:"plain",name:"Plain",price:18},{id:"soft",name:"Soft Girl",price:28},{id:"sweet",name:"Sweet Spot",price:38},{id:"slay",name:"Full Slay",price:48}];
const LENGTHS = ["","Short","Medium","Long"], SHAPES = ["","Almond","Square","Ballerina"];
const SOURCES = ["","Friend","Referral","Cold"];

/* ---------- loyalty card ---------- */
const LOY={size:8,gifts:{4:"free add-on (up to $8)",8:"$15 off the set"},short:{4:"free<br>add-on",8:"$15<br>off"}};
const CARD_BASE=new URL("card.html",location.href).href;
const PROMOS=["Referral: friend's first set","New client: $5 off first set","Birthday month","Bring a friend (book together)","Rebook within 3 weeks","Seasonal set","Flash slot (last-minute)","Press-on bundle"];
const dl={save:async({filename,data})=>{ const u=URL.createObjectURL(data); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); }};
async function syncCard(c){
  if(!c||!c.id) return;
  if(!c.cardId){ const id=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join(""); await db.collection("clients").doc(c.id).update({cardId:id}); c.cardId=id; }
  await setDoc(cardRef(c.cardId),{name:(c.name||"").trim().split(/\s+/)[0]||"QiQi friend",stamps:stampsOf(c),cardsDone:cardsOf(c),updated:Date.now()});
}
function sig(s){ let h=7; for(const ch of s) h=(h*31+ch.charCodeAt(0))>>>0; return (h%1679616).toString(36).padStart(4,"0"); }
const slugOf=n=>(n||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,24).replace(/-+$/,"")||"friend";
const stampsOf=c=>Math.min(+c.stamps||0,LOY.size), cardsOf=c=>+c.cardsDone||0;
const nextChop=c=>(stampsOf(c)>=LOY.size?0:stampsOf(c))+1;
const clientByName=n=>S.clients.find(c=>(c.name||"").trim().toLowerCase()===(n||"").trim().toLowerCase());
function cardLink(c){ return c.cardId ? CARD_BASE+"?c="+c.cardId : CARD_BASE; }
function cardMsg(c){
  const st=stampsOf(c), first=(c.name||"").split(" ")[0]; let p;
  if(st>=LOY.size) p="Your card is complete! Your $15 off was on this set, and your next visit starts a new card.";
  else if(st+1===4) p=`You're on ${st}/8 chops. Your next set gets a free add-on!`;
  else if(st+1===8) p=`You're on ${st}/8 chops. Your next set is $15 off!`;
  else if(st<4) p=`You're on ${st}/8 chops, ${4-st} more to a free add-on.`;
  else p=`You're on ${st}/8 chops, ${8-st} more to $15 off.`;
  return `Hi ${first}! Thank you for coming to QiQi ✦ ${p} Here's your loyalty card (it updates by itself after every visit): ${cardLink(c)}`;
}
function cardHTML(c){
  const st=stampsOf(c), cd=cardsOf(c); let dots="";
  for(let i=1;i<=LOY.size;i++){ const on=i<=st; dots+=`<div class="lc-dot ${on?"on":""} ${LOY.short[i]?"gift":""}">${on?"✦":(LOY.short[i]||i)}</div>`; }
  return `<div class="lc" role="img" aria-label="${st} of ${LOY.size} chops"><div class="lc-in"><div class="lc-top"><div class="lc-logo">QiQi<span>✦</span></div><div class="lc-tag">Loyalty card</div></div><div class="lc-name">${esc(c.name)}${cd?`<small>${cd} card${cd>1?"s":""} completed</small>`:""}</div><div class="lc-grid">${dots}</div><div class="lc-foot"><span><b>Chop 4</b> · free add-on</span><span><b>Chop 8</b> · $15 off</span></div></div></div>`;
}
const dotsMini=c=>{ const st=stampsOf(c); let h=""; for(let i=1;i<=LOY.size;i++) h+=`<i class="${i<=st?"on":""}"></i>`; return `<span class="chops" aria-label="${st} of 8 chops">${h}<em>${st}/8</em></span>`; };
async function chop(id,why){
  const c=S.clients.find(x=>x.id===id); if(!c) return null;
  let st=stampsOf(c), cd=cardsOf(c); if(st>=LOY.size) st=0; st++; if(st===LOY.size) cd++;
  const log=[{d:today(),why},...(c.chopLog||[])].slice(0,40);
  await db.collection("clients").doc(id).update({stamps:st,cardsDone:cd,chopLog:log});
  Object.assign(c,{stamps:st,cardsDone:cd,chopLog:log}); await syncCard(c); return c;
}
async function unchop(id){
  const c=S.clients.find(x=>x.id===id); if(!c) return null;
  let st=stampsOf(c), cd=cardsOf(c);
  if(st===LOY.size){ st--; cd--; } else if(st===1 && cd>0) st=LOY.size; else if(st>0) st--; else return c;
  const log=(c.chopLog||[]).slice(1);
  await db.collection("clients").doc(id).update({stamps:st,cardsDone:cd,chopLog:log});
  Object.assign(c,{stamps:st,cardsDone:cd,chopLog:log}); await syncCard(c); return c;
}
function renderLoy(c){
  const el=$("#loy"); if(!el) return; const nx=nextChop(c);
  if(!c.cardId){ syncCard(c).then(()=>{ if($("#loy")) renderLoy(c); }).catch(handleWriteErr); }
  el.innerHTML=`<div class="loy">${cardHTML(c)}
    <div><b>${stampsOf(c)}/8 chops</b>${LOY.gifts[nx]?` · <span class="chip warn">Next set is chop ${nx}: ${LOY.gifts[nx]}</span>`:""}</div>
    <div class="loy-btns"><button type="button" class="primary" data-chop="${c.id}">✦ Chop</button><button type="button" data-bonus="${c.id}">Referral bonus chop</button><button type="button" data-unchop="${c.id}">Undo last chop</button></div>
    <label for="loymsg">Message to send them (their card link is included)<textarea id="loymsg" readonly>${esc(cardMsg(c))}</textarea></label>

function monthSummary(m){
  const ap = S.appts.filter(a=>(a.date||"").startsWith(m));
  const po = S.presson.filter(p=>(p.ordered||"").startsWith(m));
  const ex = S.expenses.filter(e=>(e.date||"").startsWith(m));
  const sets = ap.reduce((s,a)=>s+apptIncome(a),0), tips = ap.reduce((s,a)=>s+apptTip(a),0);
  const press = po.reduce((s,p)=>s+pressIncome(p),0);
  const byCat = {}; EXP_CAT.forEach(c=>byCat[c]=0);
  ex.forEach(e=>{ byCat[e.category||"Other"] = (byCat[e.category||"Other"]||0) + (+e.amount||0); });
  const postage = po.filter(p=>p.status!=="Cancelled").reduce((s,p)=>s+(+p.postageCost||0),0);
  byCat.Shipping += postage;
  const spent = Object.values(byCat).reduce((s,v)=>s+v,0);
  const income = sets+tips+press;
  const done = ap.filter(a=>a.status==="Done");
  const bySet = SETS.map(s=>({name:s.name, n:done.filter(a=>a.service===s.id).length, sum:done.filter(a=>a.service===s.id).reduce((t,a)=>t+(+a.price||0),0)})).filter(r=>r.n);

}
function apptSummary(a){
  const bits=[byId(SETS,a.service).name.split(" · ")[0]];
  if(a.extension && a.extension!=="none") bits.push(byId(EXT,a.extension).name.split(" (")[0]);
  if(a.hardGel) bits.push("hard gel");
  if(a.length||a.shape) bits.push([a.length,a.shape].filter(Boolean).join(" ").toLowerCase());
  if(a.removal && a.removal!=="none") bits.push("removal");
  if(+a.repair) bits.push(a.repair+" repair");
  if(+a.singleExt) bits.push(a.singleExt+" single ext.");
  return bits.join(" · ");
}

function openForm(kind,id,preset){
  if(dbState==="ro"){ toast("This copy is view-only."); return; }

  const v=rec?{...rec}:{...defaults(kind),...(preset||{})};

  });

function defaults(kind){

    presson:{ordered:t,tier:"soft",status:"Quote sent"},

function readForm(){
  const sc=SCHEMA[editing.kind], out={};
  sc.fields.forEach(f=>{ if(!f.k) return; const el=$("#f_"+f.k); if(!el) return;
    if(f.t==="check") out[f.k]=el.checked;
    else if(f.t==="money"||f.t==="number") out[f.k]= el.value===""? (f.k==="reorderAt"?"":0) : +el.value;
    else out[f.k]=el.value.trim(); });
  return out;
}
function updateCalc(){
  const sc=SCHEMA[editing.kind], v=readForm(), c=sc.calc(v), box=$("#sugg");
  if(!editing.touched){ $("#f_price").value=c; }
  let loyNote="";
  if(editing.kind==="appts" && !(editing.rec&&editing.rec.chopped)){ const c=clientByName(v.clientName); if(c){ const nx=nextChop(c); if(LOY.gifts[nx]) loyNote=`<span class="chip ok" style="flex-basis:100%;white-space:normal">Loyalty: this set is chop ${nx}, so it gets ${LOY.gifts[nx]}</span>`; } }
  box.innerHTML=loyNote+`<span>From your price list</span><span style="display:flex;gap:10px;align-items:center"><b>${money(c)}</b>${editing.touched&&+$("#f_price").value!==c?`<button type="button" class="mini" data-useprice="${c}">Use this</button>`:""}</span>`;
}
async function save(e){
  e.preventDefault();
  const {kind,id,rec}=editing, sc=SCHEMA[kind]; let v=readForm();
  if(rec){ const {id:_x,...old}=rec; v={...old,...v}; v.createdAt=rec.createdAt||Date.now(); } else v.createdAt=Date.now();
  const earns=(kind==="appts"&&v.status==="Done")||(kind==="presson"&&PRESS_PAID.includes(v.status));
  const doChop=earns && !(rec&&rec.chopped) && !!v.clientName;
  if(doChop) v.chopped=true;
  let chopped=null; const why=kind==="appts"?"set":"press-on";
  if(sc.calc && (v.price===0||v.price==="") && !editing.touched) v.price=sc.calc(v);
  const btn=e.submitter; if(btn) btn.disabled=true;
  try{
    const col=db.collection(sc.col);
    const ref=id?col.doc(id):col.doc(); await ref.set(v);
    if(kind==="clients" && v.cardId) await syncCard({...v,id:ref.id});
    if((kind==="appts"||kind==="presson") && v.clientName){
      const ex=clientByName(v.clientName);
      if(!ex){
        await db.collection("clients").doc().set({name:v.clientName,createdAt:Date.now(),length:v.length||"",shape:v.shape||"",sizes:kind==="presson"?(v.sizes||""):"",source:v.source||"",referredBy:v.referredBy||"",stamps:doChop?1:0,cardsDone:0,chopLog:doChop?[{d:today(),why}]:[]});
        if(doChop) chopped={name:v.clientName,stamps:1};
      } else {
        if(kind==="appts" && v.source && !ex.source) await db.collection("clients").doc(ex.id).update({source:v.source,referredBy:v.referredBy||""});
        if(doChop) chopped=await chop(ex.id,why);
      }
    }
    $("#dlg").close();
    toast(chopped ? `Saved · ${v.clientName} chopped, now ${stampsOf(chopped)}/8. Send their card from their profile.` : `${sc.title[0].toUpperCase()+sc.title.slice(1)} saved`);
  }catch(err){ if(btn) btn.disabled=false; handleWriteErr(err); }
}
function handleWriteErr(err){
  if(err && err.code==="permission-denied") toast("Not allowed. Sign in again, or check your Firestore rules.");
  else if(err && err.code==="resource-exhausted") toast("Firebase's free daily limit is reached. Try again tomorrow.");
  else toast("Couldn't save. Check your connection and try again.");
}

});
document.addEventListener("change",e=>{
  if(e.target.id==="f_depositPaid"){ const d=$("#f_deposit"); if(e.target.checked && !(+d.value)) d.value=DEPOSIT; else if(!e.target.checked && +d.value===DEPOSIT) d.value=""; }
  if(editing && e.target.closest("#frm") && SCHEMA[editing.kind].calc && e.target.type==="checkbox") updateCalc(); });
$("#frm").addEventListener("submit",save);
document.addEventListener("submit",async e=>{
  if(e.target.id!=="login") return; e.preventDefault(); const er=$("#lerr"); er.hidden=true;
  try{ await signInWithEmailAndPassword(auth,$("#lemail").value.trim(),$("#lpass").value); }
  catch(x){ er.textContent = ["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-email"].includes(x.code) ? "That email and password don't match. Try again, or tap Forgot password."
    : x.code==="auth/unauthorized-domain" ? "This web address isn't allowed yet. In Firebase, add it under Authentication, Settings, Authorized domains."
    : x.code==="auth/too-many-requests" ? "Too many tries. Wait a few minutes and try again." : "Couldn't sign in ("+x.code+")."; er.hidden=false; }
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="restore" || !e.target.files[0]) return;
  try{
    const data=JSON.parse(await e.target.files[0].text()); let n=0, batch=writeBatch(fs), inBatch=0;
    for(const k of Object.keys(S)){ const col=SCHEMA[k].col; for(const r of (data[col]||[])){ const {id,...body}=r; if(!id) continue;
      batch.set(fdoc(colRef(col),id),body); n++; if(++inBatch===400){ await batch.commit(); batch=writeBatch(fs); inBatch=0; } } }
    if(inBatch) await batch.commit();
    for(const c of (data.clients||[])) if(c.cardId) await syncCard({...c});
    toast(`Loaded ${n} entries from the backup.`);
  }catch(err){ toast("That file isn't a QiQi backup."); }
  e.target.value="";
});
$("#dlg").addEventListener("close",()=>{ editing=null; render(); });

const qtyPending={};
function bumpQty(id,d){
  const s=S.supplies.find(x=>x.id===id); if(!s) return;
  const p=qtyPending[id] ||= {qty:+s.qty||0,timer:null};
  p.qty=Math.max(0,p.qty+ +d); s.qty=p.qty; render();
  clearTimeout(p.timer);
  p.timer=setTimeout(async()=>{ const q=p.qty; delete qtyPending[id]; try{ await db.collection("supplies").doc(id).update({qty:q}); }catch(err){ handleWriteErr(err); } },700);
}

function route(){ const h=location.hash.slice(1); tab=["today","bookings","clients","press-ons","supplies","money"].includes(h)?h:"today"; render(); window.scrollTo(0,0); }
window.addEventListener("hashchange",route);

/* ---------- data ---------- */
(function start(){
  route();
  if(!CONFIGURED){ dbState="setup"; render(); return; }
  db=shim; let unsubs=[], slow=null;
  onAuthStateChanged(auth,user=>{
    unsubs.forEach(u=>u()); unsubs=[]; clearTimeout(slow);
    $("#signout").hidden=!user;
    if(!user){ Object.keys(S).forEach(k=>S[k]=[]); dbState="none"; render(); return; }
    dbState="loading"; loaded={}; render();
    slow=setTimeout(()=>{ if(dbState==="loading"){ dbState="slow"; render(); } },10000);
    let firstReady=0;
    for(const k of Object.keys(S)){
      unsubs.push(db.collection(SCHEMA[k].col).onSnapshot(snap=>{
        S[k]=snap.docs.map(d=>({id:d.id,...d.data()}));
        for(const id in qtyPending){ const s=S.supplies.find(x=>x.id===id); if(s) s.qty=qtyPending[id].qty; }
        if(!loaded[k]){ loaded[k]=1; firstReady++; }
        if(firstReady===5 && (dbState==="loading"||dbState==="slow")){ clearTimeout(slow); dbState="ok"; }
        if(!$("#dlg").open) render();
      },err=>{ clearTimeout(slow); if(err.code==="permission-denied"){ dbState="denied"; render(); } else toast("Lost connection to your saved entries. Reload the page to reconnect."); }));
    }
  });
})();
</script>
